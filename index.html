<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4efe7;
      --ink: #18212b;
      --muted: #66717f;
      --line: #263445;
      --panel: #fffaf2;
      --x: #1f7a8c;
      --o: #d95d39;
      --win: #77b255;
      --shadow: rgba(24, 33, 43, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(31, 122, 140, 0.12), transparent 34%),
        linear-gradient(315deg, rgba(217, 93, 57, 0.13), transparent 36%),
        var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(440px, 100%);
    }

    .top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 10vw, 56px);
      line-height: 0.9;
      letter-spacing: 0;
    }

    .score {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      min-width: 168px;
    }

    .score div {
      padding: 8px 10px;
      border: 2px solid var(--line);
      background: var(--panel);
      box-shadow: 3px 3px 0 var(--line);
      text-align: center;
    }

    .score span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .score strong {
      display: block;
      margin-top: 2px;
      font-size: 22px;
      line-height: 1;
    }

    .status {
      min-height: 54px;
      margin-bottom: 14px;
      padding: 14px 16px;
      border: 2px solid var(--line);
      background: var(--panel);
      box-shadow: 5px 5px 0 var(--shadow);
      color: var(--muted);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.25;
    }

    .status strong {
      color: var(--ink);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      aspect-ratio: 1;
    }

    .cell {
      display: grid;
      place-items: center;
      width: 100%;
      min-width: 0;
      border: 3px solid var(--line);
      background: var(--panel);
      box-shadow: 6px 6px 0 var(--line);
      color: var(--ink);
      font: 900 clamp(48px, 18vw, 96px) / 1 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    .cell:hover,
    .cell:focus-visible {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 var(--line);
      outline: none;
    }

    .cell:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 var(--line);
    }

    .cell.x {
      color: var(--x);
    }

    .cell.o {
      color: var(--o);
    }

    .cell.win {
      background: #eef8dc;
      border-color: #47772f;
      box-shadow: 6px 6px 0 #47772f;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: 2px solid var(--line);
      background: var(--ink);
      color: #fffaf2;
      box-shadow: 4px 4px 0 var(--line);
      padding: 11px 15px;
      font: 800 14px / 1 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 var(--line);
      outline: none;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--line);
    }

    .note {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      text-align: right;
    }

    @media (max-width: 540px) {
      body {
        padding: 16px;
      }

      .top,
      .controls {
        align-items: stretch;
        flex-direction: column;
      }

      .score {
        min-width: 0;
      }

      .note {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <h1>Tic Tac Toe</h1>
      <div class="score" aria-label="Scoreboard">
        <div><span>X</span><strong id="x-score">0</strong></div>
        <div><span>Draw</span><strong id="draw-score">0</strong></div>
        <div><span>O</span><strong id="o-score">0</strong></div>
      </div>
    </div>

    <div class="status" id="status" aria-live="polite">Player <strong>X</strong> goes first.</div>

    <div class="board" id="board" aria-label="Tic Tac Toe board">
      <button class="cell" data-index="0" aria-label="Top left square"></button>
      <button class="cell" data-index="1" aria-label="Top middle square"></button>
      <button class="cell" data-index="2" aria-label="Top right square"></button>
      <button class="cell" data-index="3" aria-label="Middle left square"></button>
      <button class="cell" data-index="4" aria-label="Center square"></button>
      <button class="cell" data-index="5" aria-label="Middle right square"></button>
      <button class="cell" data-index="6" aria-label="Bottom left square"></button>
      <button class="cell" data-index="7" aria-label="Bottom middle square"></button>
      <button class="cell" data-index="8" aria-label="Bottom right square"></button>
    </div>

    <div class="controls">
      <button id="new-round" type="button">New Round</button>
      <button id="reset-score" type="button">Reset Score</button>
      <p class="note">Two players share the same board. Click any open square to place your mark.</p>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const wins = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6]
      ];

      const cells = Array.from(document.querySelectorAll(".cell"));
      const status = document.getElementById("status");
      const xScore = document.getElementById("x-score");
      const oScore = document.getElementById("o-score");
      const drawScore = document.getElementById("draw-score");
      const newRound = document.getElementById("new-round");
      const resetScore = document.getElementById("reset-score");

      let board = Array(9).fill("");
      let current = "X";
      let finished = false;
      let scores = { X: 0, O: 0, draw: 0 };

      function setStatus(message) {
        status.innerHTML = message;
      }

      function render() {
        cells.forEach((cell, index) => {
          const mark = board[index];
          cell.textContent = mark;
          cell.classList.toggle("x", mark === "X");
          cell.classList.toggle("o", mark === "O");
          cell.classList.remove("win");
          cell.disabled = finished || Boolean(mark);
          cell.setAttribute("aria-label", `${cell.dataset.label || cell.getAttribute("aria-label").split(":")[0]}${mark ? `: ${mark}` : ""}`);
        });

        xScore.textContent = scores.X;
        oScore.textContent = scores.O;
        drawScore.textContent = scores.draw;
      }

      function getWinner() {
        for (const line of wins) {
          const [a, b, c] = line;
          if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            return { mark: board[a], line };
          }
        }

        return null;
      }

      function play(index) {
        if (finished || board[index]) return;

        board[index] = current;
        const winner = getWinner();

        if (winner) {
          finished = true;
          scores[winner.mark] += 1;
          winner.line.forEach(i => cells[i].classList.add("win"));
          setStatus(`Player <strong>${winner.mark}</strong> wins. Nice line.`);
        } else if (board.every(Boolean)) {
          finished = true;
          scores.draw += 1;
          setStatus("It is a <strong>draw</strong>. Board full, no winner.");
        } else {
          current = current === "X" ? "O" : "X";
          setStatus(`Player <strong>${current}</strong>'s turn.`);
        }

        render();
        if (winner) winner.line.forEach(i => cells[i].classList.add("win"));
      }

      function startRound() {
        board = Array(9).fill("");
        current = "X";
        finished = false;
        setStatus("Player <strong>X</strong> goes first.");
        render();
      }

      function clearScores() {
        scores = { X: 0, O: 0, draw: 0 };
        startRound();
      }

      cells.forEach(cell => {
        cell.dataset.label = cell.getAttribute("aria-label");
        cell.addEventListener("click", () => play(Number(cell.dataset.index)));
      });

      newRound.addEventListener("click", startRound);
      resetScore.addEventListener("click", clearScores);

      render();
    })();
  </script>
</body>
</html>
